name: Build Push and Deploy to Cloud Run

on:
  push:
    branches: ["main"]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: vaulted-bonsai-487010-t7

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Image
        run: |
          docker build \
          -t sentiradar-backend:${{ github.sha }} .

      - name: Tag Image for Artifact Registry
        run: |
          docker tag sentiradar-backend:${{ github.sha }} \
          us-central1-docker.pkg.dev/vaulted-bonsai-487010-t7/fyp-backend/sentiradar-backend:${{ github.sha }}

      - name: Push Image to Artifact Registry
        run: |
          docker push \
          us-central1-docker.pkg.dev/vaulted-bonsai-487010-t7/fyp-backend/sentiradar-backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy sentiradar-backend \
            --image us-central1-docker.pkg.dev/vaulted-bonsai-487010-t7/fyp-backend/sentiradar-backend:${{ github.sha }} \
            --region us-central1 \
            --allow-unauthenticated